<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登録フォームへ移動中</title>
<style>body{font-family:sans-serif;padding:24px;color:#1F3A5F}#log{font-size:12px;color:#64748B;white-space:pre-wrap}</style>
</head>
<body>
<p id="msg">登録フォームを準備しています…</p>
<div id="log"></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// 試作の設定（秘密情報は含まない）
const CFG = {
  LIFF_ID: "__LIFF_ID__",
  GAS_URL: "__GAS_URL__",
  FORM_URL: "__FORM_URL__",   // 例 https://docs.google.com/forms/d/e/xxx/viewform
  ENTRY: "__ENTRY__"          // 例 entry.123456789（照合番号の設問）
};
const log = (s) => { document.getElementById('log').textContent += s + "\n"; };
(async () => {
  try {
    await liff.init({ liffId: CFG.LIFF_ID });
    log('1. LIFF 初期化 OK（LINE内=' + liff.isInClient() + '）');
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const idToken = liff.getIDToken();
    if (!idToken) throw new Error('IDトークンが取れない（openid スコープを確認）');
    log('2. IDトークン取得 OK');
    const res = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ idToken }) });
    const j = await res.json();
    if (!j.ok) throw new Error('GAS: ' + j.error);
    log('3. GAS で検証 OK（照合番号 ' + j.code + '）');
    const url = CFG.FORM_URL + '?usp=pp_url&' + CFG.ENTRY + '=' + encodeURIComponent(j.code);
    document.getElementById('msg').textContent = '登録フォームへ移動します';
    log('4. フォームへ移動');
    location.href = url;
  } catch (e) {
    document.getElementById('msg').textContent = 'エラーが発生しました';
    log('ERROR: ' + (e && e.message ? e.message : e));
  }
})();
</script>
</body>
</html>
