<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>おせっかい人事コミュニティ</title>
<style>
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;margin:0;padding:28px 22px;color:#1F3A5F;line-height:1.7}
h1{font-size:18px;margin:0 0 16px}
p{font-size:15px;margin:0 0 12px}
.muted{font-size:12px;color:#64748B}
form{display:none;margin-top:8px}
label{display:block;font-size:14px;margin:14px 0 4px;font-weight:600}
input[type=text],input[type=email],select{width:100%;box-sizing:border-box;font-size:16px;padding:10px;border:1px solid #CBD5E1;border-radius:6px}
.radio label,.check label{font-weight:400;display:flex;gap:8px;align-items:flex-start;margin:6px 0}
button{margin-top:20px;width:100%;font-size:16px;padding:12px;border:0;border-radius:6px;background:#06C755;color:#fff}
button:disabled{background:#94A3B8}
a{color:#2C5282}
</style>
</head>
<body>
<h1>おせっかい人事コミュニティ</h1>
<p id="msg">確認しています…</p>
<p id="sub" class="muted"></p>
<div id="choice" style="display:none">
  <button id="b_yes" type="button">申込済みの方</button>
  <button id="b_no" type="button" style="background:#2C5282">申込していない方</button>
</div>
<div id="noapply" style="display:none">
  <button id="b_retry" type="button" style="background:#64748B">入力し直す</button>
  <button id="b_toform" type="button" style="background:#2C5282">参加フォームへ進む</button>
</div>
<div id="join" style="display:none">
  <p>おせっかい人事コミュニティ（LINE 公式アカウント）に参加しますか。</p>
  <div class="check"><label><input id="agree" type="checkbox"> <span>コミュニティに参加し、今後のご案内を LINE で受け取ります。個人情報は<a href="https://www.ashrcorp.com/privacy" target="_blank" rel="noopener">株式会社ASHR のプライバシーポリシー</a>に従って取り扱われます。</span></label></div>
  <button id="b_join" type="button">参加する</button>
  <button id="b_skip" type="button" style="background:#64748B">今回は参加しない</button>
</div>
<p id="friend" style="display:none"><a id="friendlink" href="https://line.me/R/ti/p/@387rucab"><button type="button">おせっかい人事を友だち追加する</button></a></p>
<form id="f" novalidate>
  <label for="name">お名前（フルネーム）</label>
  <input id="name" type="text" autocomplete="name" required>
  <label for="mail">メールアドレス</label>
  <input id="mail" type="email" autocomplete="email" required>
  <button id="btn" type="submit">受付する</button>
</form>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// 設定（秘密情報は含まない）
const CFG = {
  LIFF_ID: "2012512395-aegtmRli",
  GAS_URL: "https://script.google.com/macros/s/AKfycbz_kDofOniuxLXmXlrAVCNzdLBn34AzjIS3P97OojzvUfTuPIEp1WF9aSVrfIYKVfr_/exec"
};
const $ = (id) => document.getElementById(id);
const show = (msg, sub) => { $('msg').textContent = msg; $('sub').textContent = sub || ''; };
const ERR = {
  nocode: ['参加ありがとうございます。', 'イベントのお申込みでお送りしたメールのリンクから開くと、登録が完了します。'],
  notfound: ['このリンクは確認できませんでした。', 'お手数ですが、届いたメールのリンクをもう一度開いてください。'],
  used: ['このリンクは別の LINE で登録済みです。', 'お心当たりがない場合は、おせっかい人事 事務局までご連絡ください。'],
  verify: ['LINE の確認ができませんでした。', '時間をおいて、もう一度開いてください。'],
  noevent: ['受付の QR コードを確認できませんでした。', 'お手数ですが、受付のスタッフにお声がけください。'],
  badmail: ['メールアドレスの形式をご確認ください。', ''],
  needinfo: ['入力されていない項目があります。', 'お名前とメールアドレスをご入力ください。'],
  noapply: ['お申込みが見つかりませんでした。', 'お申込みのときのメールアドレスをご確認ください。お申込みがない場合は、参加フォームへお進みください。'],
  needagree: ['参加には同意のチェックが必要です。', ''],
  server: ['処理に失敗しました。', '時間をおいて、もう一度開いてください。']
};
const post = async (body) => {
  const res = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
};
const checkinDone = (name) => show('受付が完了しました。', (name ? name + ' 様、' : '') + 'ご来場ありがとうございます。この画面は閉じてかまいません。');
// コミュニティ参加に同意して LINE と結んだ方だけ、友だち追加を促す（requestFriendship＝LIFF v2.28 以降・友だち済みなら小窓は自動で閉じる・profile スコープ不要）
// 使えなかったときだけ、友だち追加のボタンを出す
const askFriend = async () => {
  try { await liff.requestFriendship(); } catch (_) { $('friend').style.display = 'block'; }
};

(async () => {
  try {
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const q = new URLSearchParams(location.search);
    const t = q.get('t') || '';
    const ev = q.get('e') || '';
    const idToken = liff.getIDToken();
    if (!idToken) { show.apply(null, ERR.verify); return; }

    // 当日受付（会場の QR）
    if (ev) {
      const j = await post({ mode: 'checkin', idToken, e: ev });
      if (j.ok) { checkinDone(j.name); if (j.linked) askFriend(); return; }
      if (j.error !== 'needinfo') { show.apply(null, ERR[j.error] || ERR.server); return; }
      show('受付', 'このイベントにお申込み済みですか。');
      const c = $('choice'); c.style.display = 'block';
      // 申込なし（または申込が見つからない）→ 受付番号入りの参加フォームへ
      const toForm = async (btns) => {
        btns.forEach(b => { b.disabled = true; });
        try {
          const j3 = await post({ mode: 'checkin', idToken: liff.getIDToken(), e: ev, applied: 'no' });
          if (j3.ok && j3.form) { show('参加フォームを開いています…', ''); location.href = j3.form; return; }
          show.apply(null, ERR[j3.error] || ERR.server);
        } catch (_) { show.apply(null, ERR.server); }
        btns.forEach(b => { b.disabled = false; });
      };
      $('b_no').addEventListener('click', () => toForm([$('b_no'), $('b_yes')]));
      $('b_toform').addEventListener('click', () => toForm([$('b_toform'), $('b_retry')]));
      $('b_retry').addEventListener('click', () => {
        $('noapply').style.display = 'none';
        show('受付', 'お申込みのときのお名前とメールアドレスをご入力ください。');
        $('f').style.display = 'block'; $('btn').disabled = false;
      });
      // 申込済みでコミュニティ未参加の方：受付の画面で参加を選べる
      let who = { name: '', mail: '' };
      $('b_join').addEventListener('click', async () => {
        if (!$('agree').checked) { show.apply(null, ERR.needagree); return; }
        $('b_join').disabled = true; $('b_skip').disabled = true;
        try {
          const j4 = await post({ mode: 'join', idToken: liff.getIDToken(), e: ev, name: who.name, mail: who.mail, agree: true });
          if (j4.ok) {
            $('join').style.display = 'none';
            show('コミュニティへの参加が完了しました。', 'おせっかい人事コミュニティからのご案内を LINE でお届けします。この画面は閉じてかまいません。');
            askFriend(); return;
          }
          show.apply(null, ERR[j4.error] || ERR.server);
        } catch (_) { show.apply(null, ERR.server); }
        $('b_join').disabled = false; $('b_skip').disabled = false;
      });
      $('b_skip').addEventListener('click', () => { $('join').style.display = 'none'; checkinDone(who.name); });
      $('b_yes').addEventListener('click', () => {
        c.style.display = 'none';
        show('受付', 'お申込みのときのお名前とメールアドレスをご入力ください。');
        $('f').style.display = 'block';
      });
      const f = $('f');
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        $('btn').disabled = true;
        try {
          const j2 = await post({
            mode: 'checkin', idToken: liff.getIDToken(), e: ev, applied: 'yes',
            name: $('name').value.trim(), mail: $('mail').value.trim()
          });
          if (j2.ok) {
            f.style.display = 'none';
            if (j2.canJoin) {
              who = { name: $('name').value.trim(), mail: $('mail').value.trim() };
              show('受付が完了しました。', (j2.name ? j2.name + ' 様、' : '') + 'ご来場ありがとうございます。続けて、コミュニティへの参加を選べます。');
              $('join').style.display = 'block';
            } else { checkinDone(j2.name); if (j2.linked) askFriend(); }
          }
          else if (j2.error === 'noapply') { f.style.display = 'none'; show.apply(null, ERR.noapply); $('noapply').style.display = 'block'; }
          else { show.apply(null, ERR[j2.error] || ERR.server); $('btn').disabled = false; }
        } catch (_) { show.apply(null, ERR.server); $('btn').disabled = false; }
      });
      return;
    }

    // 申込メールの参加リンク
    if (!t) { show.apply(null, ERR.nocode); return; }
    const j = await post({ idToken, t });
    if (j.ok) {
      show('登録が完了しました。', 'おせっかい人事コミュニティからのご案内を LINE でお届けします。この画面は閉じてかまいません。');
      askFriend();
    } else {
      show.apply(null, ERR[j.error] || ERR.server);
    }
  } catch (e) {
    show.apply(null, ERR.server);
  }
})();
</script>
</body>
</html>
